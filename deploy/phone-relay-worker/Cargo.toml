[package]
name = "interface-phone-relay-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# Its own workspace: the Worker builds for wasm32 with its own lockfile and is
# not part of the app's workspace or gate.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "p256"] }
interface-contracts = { path = "../../crates/interface-contracts" }
rand_core = { version = "=0.9.5", default-features = false, features = ["os_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { version = "0.3.31", default-features = false, features = ["std"] }
# Owner-approved 2026-10-05. 0.8.7 needs Rust 1.91; the repository pins 1.88.
worker = "=0.8.6"
# Browser randomness for the HPKE challenge and request ids inside Workers.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# p256's rand_core 0.6 still reaches getrandom 0.2.
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
uuid = { version = "1.18.1", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
