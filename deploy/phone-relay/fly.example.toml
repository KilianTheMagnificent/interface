# Replace both placeholders before deploying. The Mac ID is public, not a credential.
app = "YOUR-INTERFACE-RELAY"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "--bind 0.0.0.0:8080 --mac-id YOUR_64_CHARACTER_PUBLIC_MAC_ID"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 16
    hard_limit = 24

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "always"
