<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <title>Dawn over a calm sea</title>
  <defs>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8"/><stop offset=".55" stop-color="#ffdf9e"/><stop offset="1" stop-color="#ffc98a"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".75"/><stop offset=".45" stop-color="#ffc9a8" stop-opacity=".32"/><stop offset="1" stop-color="#ffc9a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9e6"/><stop offset="1" stop-color="#9cc3d6"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc8da"/><stop offset="1" stop-color="#7fb0c8"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#84b6cc"/><stop offset="1" stop-color="#6298b4"/></linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ea5bf"/><stop offset="1" stop-color="#4f86a4"/></linearGradient>
  </defs>
  <style>
    .cloud { fill: #fffaf0; fill-opacity: .86; animation: cloud 160s linear infinite; }
    @keyframes cloud { from { transform: translateX(-420px); } to { transform: translateX(1900px); } }
    .sun { animation: rise 60s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(16px); } to { transform: translateY(-14px); } }
    .glow { animation: breathe 11s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: .7; } to { opacity: 1; } }
    .wave { animation: slide 24s linear infinite; }
    .wave.b { animation-duration: 17s; animation-direction: reverse; }
    .wave.c { animation-duration: 12s; }
    .wave.d { animation-duration: 9s; animation-direction: reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-400px); } }
    .bob { animation: bob 7s ease-in-out infinite alternate; transform-origin: 470px 690px; }
    @keyframes bob { from { transform: translateY(-3px) rotate(-2.2deg); } to { transform: translateY(4px) rotate(2.4deg); } }
    .gull { animation: glide 60s linear infinite; }
    @keyframes glide { from { transform: translate(-500px, 40px); } to { transform: translate(1700px, -90px); } }
    .wing { fill: none; stroke: #5d6f7c; stroke-width: 2.4; stroke-linecap: round; animation: flap 1.3s ease-in-out infinite alternate; }
    .wing.r { animation-name: flap-r; }
    @keyframes flap { from { transform: rotate(16deg); } to { transform: rotate(-20deg); } }
    @keyframes flap-r { from { transform: rotate(-16deg); } to { transform: rotate(20deg); } }
    .glint { fill: #fff3d0; opacity: 0; animation: glint 5s ease-in-out infinite; }
    @keyframes glint { 0%, 100% { opacity: 0; } 50% { opacity: .8; } }
  </style>
  <circle class="glow" cx="1310" cy="560" r="430" fill="url(#glow)"/>
  <g class="sun"><circle cx="1310" cy="560" r="92" fill="url(#sun)"/></g>
