<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>A neon sun setting behind wireframe mountains</title>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset=".45" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff3fb4"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5cc8" stop-opacity=".55"/><stop offset="1" stop-color="#ff5cc8" stop-opacity="0"/></radialGradient>
    <clipPath id="disc"><circle cx="800" cy="420" r="170"/></clipPath>
    <mask id="stripes"><rect x="560" y="200" width="480" height="420" fill="#fff"/><g fill="#000"><rect x="560" y="352" width="480" height="6"/><rect x="560" y="390" width="480" height="10"/><rect x="560" y="430" width="480" height="14"/><rect x="560" y="472" width="480" height="20"/><rect x="560" y="516" width="480" height="26"/><rect x="560" y="562" width="480" height="34"/></g></mask>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150530"/><stop offset="1" stop-color="#0a0218"/></linearGradient>
  </defs>
  <style>
    .s { animation: tw 4s ease-in-out infinite alternate; }
    @keyframes tw { from { opacity: .1; } to { opacity: .95; } }
    .halo { animation: pulse 6s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
    .far { fill: #170838; stroke: #b14dff; stroke-width: 2; stroke-linejoin: round; }
    .near { fill: url(#fade); stroke: #3df5ff; stroke-width: 2.4; stroke-linejoin: round; }
    .ff line { stroke: #b14dff; stroke-width: 1; opacity: .5; }
    .nf line { stroke: #3df5ff; stroke-width: 1; opacity: .45; }
    .glow { animation: flick 3.2s steps(6) infinite alternate; }
    @keyframes flick { from { opacity: .65; } to { opacity: 1; } }
    .comet { opacity: 0; animation: comet 13s linear infinite; }
    @keyframes comet { 0%, 84% { opacity: 0; transform: translate(0,0); } 86% { opacity: 1; } 93% { opacity: 1; } 96%, 100% { opacity: 0; transform: translate(620px, 150px); } }
  </style>
